/* Plataforma HVAC: tokens de tema, base e componentes comuns aos apps.
   Regra do guia: nenhum valor de cor fora dos blocos de tokens. Cor própria de um app entra no CSS do app.
   Direção visual (v0.5.0, docs\DESIGN.md): folha de dados técnica. Papel frio e branco, canto vivo no que é documento,
   cor por função em tom suave e cor forte só para erro e alerta. O @import acima é expandido pelo embutir.ps1. */
:root {
  --fundo: #eef1f3; --sup: #ffffff; --sup2: #f5f7f8; --linha: #d0d7dc; --linha-forte: #8e9aa3;
  --tinta: #142027; --tinta2: #44535c; --tinta3: #5f6d76;
  --prim: #0e5f59; --prim-tinta: #ffffff; --prim-suave: #dcebe8;
  --norma-f: #e6ecd6; --norma-t: #42511c;
  --alt-f: #fbe7c2; --alt-t: #744600;
  --calc-f: #e6eaed; --calc-t: #44535c;
  --demo-f: #e7e0f3; --demo-t: #4a3879;
  --erro: #b3261e; --alerta: #8a5200; --ok: #2c6b2f;
  /* sombra só no que flutua sobre a tela (gaveta, janela, balões); nada de sombra em cartão ou bloco */
  --sombra: 0 6px 20px rgba(20, 32, 39, .18);
  /* canto: vivo no que é documento (cartão, bloco, campo, tabela, selo); um pouco maior no que se toca (botão) */
  --raio: 2px; --raio-toque: 4px; --raio-folha-sobe: 8px;
  --fonte: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --fonte-titulo: "IBM Plex Sans Condensed", "Arial Narrow", "Segoe UI", system-ui, sans-serif;
  --fonte-dado: "IBM Plex Mono", "Cascadia Mono", Consolas, monospace;
  --fonte-rotulo: var(--fonte-titulo);
  /* Cores que valem igual nos dois temas: véu das janelas, variação da faixa e a folha do memorial (papel branco). */
  --veu: rgba(10, 16, 16, .45); --faixa-delta: rgba(127, 127, 127, .3);
  --folha-fundo: #fff; --folha-tinta: #1b1b1b; --folha-tinta2: #555; --folha-linha: #d5d5d5;
  color-scheme: light;
}
:root[data-tema="escuro"] {
  --fundo: #11171b; --sup: #182025; --sup2: #1e272d; --linha: #2c3840; --linha-forte: #50606b;
  --tinta: #e6ecef; --tinta2: #b2bec5; --tinta3: #8c9aa2;
  --prim: #5fc4b8; --prim-tinta: #0b1f1d; --prim-suave: #1d3734;
  --norma-f: #2c3520; --norma-t: #c9d8a2;
  --alt-f: #45330f; --alt-t: #f3cf8a;
  --calc-f: #263036; --calc-t: #b2bec5;
  --demo-f: #2f2945; --demo-t: #cbbdf0;
  --erro: #ff8a80; --alerta: #f0b862; --ok: #8fd694;
  --sombra: 0 6px 20px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--fundo); color: var(--tinta); font: 15px/1.5 var(--fonte); padding-bottom: 76px; }
h1, h2, h3 { font-family: var(--fonte-titulo); line-height: 1.2; margin: 0; text-wrap: balance; }
h1 { font-size: 28px; font-weight: 600; }
h2 { font-size: 19px; font-weight: 600; }
h3 { font-size: 15px; font-weight: 600; }
p { margin: 0; }
a { color: var(--prim); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--prim); outline-offset: 2px; border-radius: var(--raio-toque); }
/* quem pede menos movimento no sistema não vê transição (P10, v0.5.1) */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
}
.num { font-variant-numeric: tabular-nums; }
.suave { color: var(--tinta2); }
.fraco { color: var(--tinta3); font-size: 13px; }
.oculto { display: none !important; }

/* ---------- Topo e trilha ---------- */
.topo { position: sticky; top: 0; z-index: 20; background: var(--sup); border-bottom: 1px solid var(--linha); }
.topo-linha { max-width: 1040px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.marca { display: flex; align-items: center; gap: 8px; font-family: var(--fonte-titulo); font-weight: 700; text-decoration: none; color: var(--tinta); white-space: nowrap; }
.marca svg { width: 26px; height: 26px; }
.marca small { font-weight: 500; color: var(--tinta3); font-size: 12px; }
.topo-acoes { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.icone { background: none; border: 1px solid transparent; border-radius: var(--raio-toque); padding: 6px 10px; color: var(--tinta2); font-size: 13px; white-space: nowrap; }
.icone:hover { background: var(--sup2); border-color: var(--linha); }
.icone[aria-pressed="true"] { background: var(--prim-suave); color: var(--prim); border-color: transparent; font-weight: 600; }
kbd { font: 11px var(--fonte-dado); border: 1px solid var(--linha-forte); border-bottom-width: 2px; border-radius: var(--raio); padding: 0 5px; color: var(--tinta2); background: var(--sup); }

.trilha { max-width: 1040px; margin: 0 auto; padding: 0 16px 10px; display: flex; gap: 4px; list-style: none; overflow-x: auto; }
.trilha li { flex: 1 1 0; min-width: 118px; }
.trilha a { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--raio); text-decoration: none; color: var(--tinta2); border: 1px solid transparent; }
.trilha a:hover { background: var(--sup2); }
/* o passo é uma sequência real: número em quadro de canto vivo, como a etapa de um carimbo (não em círculo) */
.trilha .n { flex: none; width: 24px; height: 24px; border-radius: var(--raio); border: 1.5px solid var(--linha-forte); display: grid; place-items: center; font: 500 12px var(--fonte-dado); }
.trilha .t { display: block; font-weight: 600; font-size: 14px; line-height: 1.2; white-space: nowrap; }
.trilha .s { display: block; font-size: 12px; color: var(--tinta3); white-space: nowrap; }
.trilha a[aria-current="page"] { background: var(--prim-suave); color: var(--tinta); }
.trilha a[aria-current="page"] .n { background: var(--prim); border-color: var(--prim); color: var(--prim-tinta); }
.trilha .pend .s { color: var(--alerta); }

/* ---------- Estrutura da tela ---------- */
main { max-width: 860px; margin: 0 auto; padding: 28px 16px 40px; }
main.larga { max-width: 1040px; }
.cabeca { margin-bottom: 20px; }
/* linha de contexto ("Passo 1 de 4"): referência em fonte de dado, sem caixa alta espaçada */
.cabeca .sobre { font: 500 12.5px var(--fonte-dado); color: var(--tinta2); margin-bottom: 6px; }
.cabeca p { color: var(--tinta2); margin-top: 6px; max-width: 62ch; }
.cartao { background: var(--sup); border: 1px solid var(--linha); border-radius: var(--raio); padding: 18px; margin-bottom: 14px; }
/* título de seção da folha: régua escura embaixo, como num memorial */
.cartao > h2 { margin-bottom: 12px; padding-bottom: 4px; border-bottom: 1.5px solid var(--tinta); }
.grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px 18px; }
.grade.g2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.grade:not(.g2) > .campo { max-width: 300px; }
.acoes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.botao { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--linha-forte); background: var(--sup); border-radius: var(--raio-toque); padding: 8px 14px; font-weight: 600; text-decoration: none; color: var(--tinta); }
.botao:hover { border-color: var(--prim); }
.botao.prim { background: var(--prim); border-color: var(--prim); color: var(--prim-tinta); }
.botao.leve { border-color: transparent; background: none; color: var(--prim); padding: 6px 8px; }
.botao.perigo:hover { border-color: var(--erro); color: var(--erro); }
/* aviso e "Por quê?": nota em quadro de traço fino, sem a barra lateral grossa e sem o fundo pastel */
.aviso { border: 1px solid var(--demo-t); background: var(--sup); color: var(--demo-t); border-radius: var(--raio); padding: 10px 14px; font-size: 14px; margin-bottom: 14px; }
.aprender { border-top: 1.5px solid var(--prim); border-bottom: 1px solid var(--linha); background: var(--sup2); border-radius: 0; padding: 10px 14px; font-size: 14px; margin: 0 0 14px; }
.aprender b { color: var(--prim); }

/* ---------- Campo com estado ---------- */
.campo { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.campo label, .rotulo { font-size: 13px; font-weight: 600; color: var(--tinta2); }
.entrada { display: flex; align-items: stretch; border: 1px solid var(--linha-forte); border-radius: var(--raio); background: var(--sup); overflow: hidden; }
.entrada:focus-within { border-color: var(--prim); box-shadow: 0 0 0 3px var(--prim-suave); }
.entrada input, .entrada select { flex: 1; min-width: 0; border: 0; background: transparent; padding: 9px 11px; outline: none; font-size: 15px; }
.entrada input.num { text-align: right; font-weight: 600; }
.entrada .un { display: grid; place-items: center; padding: 0 10px; font: 13px var(--fonte-dado); color: var(--tinta3); background: var(--sup2); border-left: 1px solid var(--linha); white-space: nowrap; }
.entrada.fixo { background: var(--sup2); border-style: dashed; }
.entrada.fixo input { color: var(--tinta2); }
.campo.invalido .entrada { border-color: var(--erro); }
.estado { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 22px; }
/* selo de origem: etiqueta de canto vivo em tom suave (a cor diz a função, o texto sempre presente); não é pílula */
.selo { display: inline-flex; align-items: center; gap: 4px; border: 0; border-radius: var(--raio); padding: 2px 7px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.selo.norma { background: var(--norma-f); color: var(--norma-t); }
.selo.alterado { background: var(--alt-f); color: var(--alt-t); }
.selo.calc { background: var(--calc-f); color: var(--calc-t); }
.selo.demo { background: var(--demo-f); color: var(--demo-t); }
.selo.mantido { background: var(--prim-suave); color: var(--prim); }
button.selo:hover { filter: brightness(.95); text-decoration: underline; }
.voltar { border: 0; background: none; color: var(--tinta2); font-size: 12px; padding: 2px 4px; text-decoration: underline; }
.msg { font-size: 12.5px; color: var(--alerta); }
.campo.invalido .msg { color: var(--erro); }
.seg { display: inline-flex; border: 1px solid var(--linha-forte); border-radius: var(--raio-toque); overflow: hidden; background: var(--sup); }
.seg button { border: 0; background: none; padding: 8px 12px; font-size: 14px; border-right: 1px solid var(--linha); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--prim); color: var(--prim-tinta); font-weight: 600; }
.valor-calc { display: inline-flex; align-items: baseline; gap: 6px; border: 1px dashed var(--linha-forte); background: var(--sup2); border-radius: var(--raio); padding: 8px 11px; font-weight: 650; color: var(--tinta); text-align: left; }
.valor-calc:hover { border-color: var(--prim); }
.valor-calc small { font-weight: 500; color: var(--tinta3); }

/* ---------- Bloco recolhível (frase-resumo) ---------- */
.bloco { background: var(--sup); border: 1px solid var(--linha); border-radius: var(--raio); margin-bottom: 10px; }
.bloco-cab { width: 100%; display: grid; grid-template-columns: 30px 1fr auto 18px; gap: 12px; align-items: center; padding: 14px 16px; background: none; border: 0; text-align: left; border-radius: var(--raio); }
.bloco-cab:hover { background: var(--sup2); }
.bloco-cab .n { width: 28px; height: 28px; border-radius: var(--raio); border: 1.5px solid var(--prim); color: var(--prim); display: grid; place-items: center; font: 500 13px var(--fonte-dado); }
.bloco-cab .tit { font-weight: 600; font-size: 16px; display: block; }
.bloco-cab .frase { color: var(--tinta2); font-size: 14px; display: block; }
.bloco-cab .carga { text-align: right; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.bloco-cab .carga small { display: block; font-weight: 500; color: var(--tinta3); font-size: 12px; }
.bloco-cab .seta { color: var(--tinta3); transition: transform .15s; }
.bloco.aberto .bloco-cab .seta { transform: rotate(90deg); }
.bloco.aberto { border-color: var(--linha-forte); }
.bloco-corpo { padding: 4px 16px 18px 58px; }
.sub { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--linha); }
.sub > h3 { margin-bottom: 10px; }
details.mais { margin-top: 16px; border-top: 1px solid var(--linha); padding-top: 12px; }
details.mais > summary { cursor: pointer; font-weight: 600; color: var(--prim); font-size: 14px; }
details.mais > .grade { margin-top: 12px; }

/* ---------- Lista de ambientes (linha: nome, indicadores e ações; o app pode trocar as colunas) ---------- */
.amb-item { display: grid; grid-template-columns: 1fr auto auto; gap: 16px; align-items: center; padding: 14px 16px; background: var(--sup); border: 1px solid var(--linha); border-radius: var(--raio); margin-bottom: 10px; }
.amb-item:hover { border-color: var(--prim); }
.amb-item a.nome { font-weight: 600; font-size: 16px; color: var(--tinta); text-decoration: none; }
.amb-item a.nome:hover { color: var(--prim); text-decoration: underline; }
.amb-item .kpi { text-align: right; }
.amb-item .kpi b { font-size: 18px; }

/* ---------- Tabelas ---------- */
.tabela-rolo { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--linha); text-align: left; vertical-align: top; }
/* cabeçalho de tabela: o único lugar (com o carimbo) em que a caixa alta é permitida, em fonte estreita */
th { font-family: var(--fonte-rotulo); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--tinta2); font-weight: 600; white-space: nowrap; border-bottom-color: var(--linha-forte); }
td.num, th.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
tr.total td { font-weight: 600; border-top: 2px solid var(--linha-forte); }
tr.clicavel { cursor: pointer; }
tr.clicavel:hover td { background: var(--sup2); }
.x { border: 0; background: none; color: var(--tinta3); font-size: 18px; padding: 6px; border-radius: var(--raio-toque); }
.x:hover { color: var(--erro); background: var(--sup2); }

/* ---------- Número em destaque, indicadores, barras, cartões e lista de pendências ---------- */
.heroi-res { display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: center; }
.numero { font-family: var(--fonte-titulo); font-size: 64px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.numero small { font-size: 24px; font-weight: 600; color: var(--tinta2); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.kpi-c { border: 1px solid var(--linha); border-radius: var(--raio); padding: 10px 12px; background: var(--sup); text-align: left; }
button.kpi-c:hover { border-color: var(--prim); }
.kpi-c span { display: block; font-size: 12px; color: var(--tinta3); font-weight: 600; }
.kpi-c b { font-size: 18px; font-variant-numeric: tabular-nums; }
.barras { display: grid; grid-template-columns: minmax(150px, 230px) 1fr 84px 52px; gap: 6px 12px; align-items: center; font-size: 14px; }
.barras .linha-b { display: contents; cursor: pointer; }
.barras .linha-b:hover .nome { color: var(--prim); text-decoration: underline; }
.barras .trilho { height: 14px; position: relative; }
.barras .barra { position: absolute; top: 0; bottom: 0; background: var(--prim); border-radius: 0; min-width: 2px; }
.barras .barra.neg { background: var(--tinta3); border-radius: 0; }
.barras .eixo { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--linha-forte); }
.barras .v, .barras .p { text-align: right; font-variant-numeric: tabular-nums; }
.barras .p { color: var(--tinta3); }
.pesos { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.peso { border: 1px solid var(--linha); border-radius: var(--raio); padding: 12px; }
.peso b { display: block; font-size: 22px; font-family: var(--fonte-titulo); font-variant-numeric: tabular-nums; }
.pend { list-style: none; padding: 0; margin: 0; }
.pend li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--linha); }
.pend li:last-child { border-bottom: 0; }

/* ---------- Faixa de resultado ---------- */
.faixa { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--tinta); color: var(--fundo); }
.faixa-linha { max-width: 1040px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.faixa .item span { display: block; font-size: 11.5px; opacity: .75; }
.faixa .item b { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.faixa .delta { font-size: 13px; border-radius: var(--raio); padding: 3px 8px; background: var(--faixa-delta); font-variant-numeric: tabular-nums; }
.faixa a { margin-left: auto; color: inherit; font-weight: 600; text-decoration: none; border: 1px solid currentColor; border-radius: var(--raio-toque); padding: 7px 12px; }

/* ---------- Gaveta, paleta e janela ---------- */
.veu { position: fixed; inset: 0; background: var(--veu); z-index: 40; }
.gaveta { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--sup); z-index: 41; box-shadow: var(--sombra); display: flex; flex-direction: column; }
.gaveta header { padding: 18px 20px 12px; border-bottom: 1px solid var(--linha); display: flex; gap: 12px; align-items: flex-start; }
.gaveta header div { flex: 1; }
.gaveta .corpo { padding: 16px 20px 28px; overflow: auto; }
.gaveta .valor-g { font-family: var(--fonte-titulo); font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; }
.passo { border: 1px solid var(--linha); border-radius: var(--raio); padding: 10px 12px; margin-bottom: 8px; }
.passo .q { font-weight: 600; display: flex; justify-content: space-between; gap: 12px; }
.passo .f { font-family: var(--fonte-dado); font-size: 13px; color: var(--tinta2); margin-top: 2px; overflow-wrap: anywhere; }
.passo .fo { font-size: 12.5px; color: var(--tinta3); margin-top: 4px; }
.janela { position: fixed; top: 12vh; left: 50%; transform: translateX(-50%); width: min(640px, calc(100vw - 24px)); max-height: 76vh; overflow: auto; background: var(--sup); z-index: 41; border-radius: var(--raio-toque); box-shadow: var(--sombra); padding: 16px; }
.janela h2 { margin-bottom: 10px; }
.paleta input { width: 100%; border: 1px solid var(--linha-forte); border-radius: var(--raio); padding: 10px 12px; background: var(--sup); font-size: 16px; }
.paleta ul { list-style: none; margin: 10px 0 0; padding: 0; }
.paleta li button { width: 100%; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: var(--raio); display: flex; justify-content: space-between; gap: 10px; }
.paleta li button.ativo, .paleta li button:hover { background: var(--prim-suave); }

@media (max-width: 760px) {
  h1 { font-size: 23px; }
  .trilha .s { display: none; }
  .trilha li { min-width: 0; }
  .trilha .t { font-size: 13px; }
  .topo-acoes .txt { display: none; }
  .bloco-corpo { padding-left: 16px; }
  .bloco-cab { grid-template-columns: 30px 1fr 18px; }
  .bloco-cab .carga { grid-column: 2; text-align: left; }
  .bloco-cab .carga small { display: inline; margin-left: 6px; }
  .heroi-res { grid-template-columns: 1fr; gap: 14px; }
  .numero { font-size: 48px; }
  .barras { display: block; }
  .barras .linha-b { display: grid; grid-template-columns: 1fr auto 44px; gap: 3px 10px; margin-bottom: 10px; }
  .barras .trilho { grid-column: 1 / -1; grid-row: 2; }
  .faixa-linha { gap: 14px; }
  .faixa .item.sec { display: none; }
  .amb-item { grid-template-columns: 1fr; }
  .amb-item .kpi { text-align: left; }
}

/* ---------- Celular (v0.4.0; especificação aprovada na sessão M0, itens C1 a C17) ----------
   Regra que muda elemento que já existe: só sob @media screen and (max-width: 760px). O "screen" é obrigatório: sem ele o
   navegador aplica a regra também na impressão e o PDF muda (achado da M0). A regra estreita acima (sem "screen") fica como está.
   Elemento novo (cel-*) nasce oculto aqui e só aparece em tela estreita: no computador não ocupa nenhum pixel. */
.cel-menu, .cel-passos, .cel-dica, .cel-cartoes, .cel-rolar { display: none; }
/* .so-celular: só em tela estreita (some no computador e no papel); .so-computador: some em tela estreita */
@media not screen and (max-width: 760px) { .so-celular { display: none !important; } }
/* Seletor de arquivo de projeto sobre um botão, invisível (input[type=file][data-arquivo-projeto] dentro de .arquivo-projeto):
   o seletor escondido com display:none e acionado por código falha em alguns celulares */
.arquivo-projeto { position: relative; overflow: hidden; cursor: pointer; }
.arquivo-projeto input[type=file] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; cursor: pointer; }

@media screen and (max-width: 760px) {
  .so-computador { display: none !important; }

  /* página e área segura (entalhe do iPhone, barra de gestos; o app põe viewport-fit=cover no index.html) (C11) */
  body { padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
  body:has(#faixa.faixa) { padding-bottom: calc(124px + env(safe-area-inset-bottom)); }
  main { padding: 16px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left)); }
  .cartao { padding: 14px; }
  button, a, input, select, textarea, summary, label { touch-action: manipulation; }   /* sem o atraso do toque duplo (C16) */

  /* topo: marca e um botão Menu; o rótulo de versão vai para o Menu e a trilha desce para a barra de passos (C1) */
  .topo { padding-top: env(safe-area-inset-top); }
  .topo-linha { padding: 6px max(12px, env(safe-area-inset-right)) 6px max(12px, env(safe-area-inset-left)); gap: 8px; }
  .marca { min-width: 0; min-height: 44px; }
  .marca span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .marca small { display: none; }
  .topo-acoes > :not(.cel-menu) { display: none; }
  .cel-menu { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; min-width: 44px; border-color: var(--linha); font-weight: 600; color: var(--tinta); }
  .topo .trilha { display: none; }
  .cel-lista-menu { display: grid; gap: 8px; }   /* Menu (C2) */
  .cel-lista-menu .botao { justify-content: flex-start; width: 100%; }

  /* barra de passos embaixo: passo anterior, passo atual (abre a lista dos passos) e próximo (C3) */
  .cel-passos { display: grid; grid-template-columns: 64px minmax(0, 1fr) 64px; position: fixed; left: 0; right: 0; bottom: 0; z-index: 16;
    background: var(--sup); border-top: 1px solid var(--linha); padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .cel-passos > * { min-height: 56px; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none;
    color: var(--prim); background: none; border: 0; padding: 4px 2px; font-size: 22px; line-height: 1; }
  .cel-passos small { font-size: 11px; color: var(--tinta3); margin-top: 2px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cel-passos .vazio { visibility: hidden; }
  .cel-passos .atual { color: var(--tinta); font-size: 15px; border-left: 1px solid var(--linha); border-right: 1px solid var(--linha); }
  .cel-passos .atual small { margin: 0; }
  .cel-passos .atual b { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .cel-passos .atual .pend { color: var(--alerta); }
  .cel-trilha { flex-direction: column; max-width: none; padding: 0; gap: 4px; overflow: visible; }   /* lista dos passos, na janela */
  .cel-trilha li { flex: none; }
  .cel-trilha a { min-height: 52px; }
  .cel-trilha .s { display: block; white-space: normal; }

  /* faixa de resultado: uma linha, logo acima da barra de passos; a variação vira um balão acima dela (C4) */
  .faixa { bottom: calc(57px + env(safe-area-inset-bottom)); }
  .faixa-linha { position: relative; padding: 6px 12px; gap: 12px; flex-wrap: nowrap; }
  .faixa .item { min-width: 0; }
  .faixa .item span { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .faixa .item b { font-size: 15px; white-space: nowrap; }
  .faixa .delta { position: absolute; right: 12px; top: -34px; background: var(--tinta); box-shadow: var(--sombra); }
  .faixa a { display: inline-flex; align-items: center; padding: 6px 10px; font-size: 13px; white-space: nowrap; }
  /* com um campo em edição (teclado aberto), a barra de passos e a faixa somem (C15) */
  body.cel-digitando .cel-passos, body.cel-digitando .faixa { display: none; }

  /* campos: letra de 16 px (abaixo disso o iPhone amplia a tela ao tocar) e 44 px de altura; o campo ocupa a largura (C5) */
  input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=range]), select, textarea { font-size: 16px; }
  .entrada input, .entrada select { min-height: 44px; }
  .grade:not(.g2) > .campo { max-width: none; }
  /* grade só de números (digitados ou calculados): duas colunas; com texto, lista ou segmentado, uma (C6) */
  .grade:has(> .campo):not(:has(input[data-tipo="txt"], select, textarea, .seg)) { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 10px; }
  .valor-calc { max-width: 100%; flex-wrap: wrap; }
  .estado .selo { white-space: normal; }

  /* alvos de toque de 44 px; selo e "voltar ao padrão" mantêm o desenho e a área de toque cresce para fora (C7) */
  .botao, .seg button, .valor-calc, .faixa a, .paleta li button { min-height: 44px; }
  .x { min-width: 44px; min-height: 44px; }
  button.selo, .voltar { position: relative; }
  button.selo::after, .voltar::after { content: ""; position: absolute; inset: -11px -4px; }
  .voltar { padding: 4px; }

  /* gaveta da conta e janelas (relatório, ajuda, Menu, comandos): folha que sobe de baixo (C8) */
  .gaveta { top: auto; left: 0; right: 0; width: 100%; max-height: 88vh; max-height: 88dvh; border-radius: var(--raio-folha-sobe) var(--raio-folha-sobe) 0 0; padding-bottom: env(safe-area-inset-bottom); }
  .gaveta header { position: relative; padding: 24px 16px 12px; }
  .gaveta header::before, .janela::before { content: ""; position: absolute; top: 8px; left: 50%; width: 40px; height: 4px; margin-left: -20px; border-radius: 2px; background: var(--linha-forte); }
  .gaveta .corpo { padding: 14px 16px 24px; }
  .gaveta .valor-g { font-size: 26px; }

<script>
/* ==== plataforma v0.8.0: js/util/formatacao.js ==== */
/* Formatação numérica (padrão brasileiro: vírgula decimal) e utilidades de texto. */
(function (H) {
  'use strict';

  function num(v, casas) {
    if (v === null || v === undefined || isNaN(v)) return '—';
    if (casas === undefined) casas = 2;
    var s = Math.abs(Number(v)).toFixed(casas);
    var partes = s.split('.');
    partes[0] = partes[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    var negativo = Number(v) < 0 && Number(s) !== 0;
    return (negativo ? '−' : '') + partes.join(',');
  }

  function numU(v, casas, unidade) {
    return num(v, casas) + (unidade ? ' ' + unidade : '');
  }

  // Valor para dentro de um <input>: sem separador de milhar, sem zeros à direita
  function campo(v, casas) {
    if (v === null || v === undefined || isNaN(v)) return '';
    var s = Number(v).toFixed(casas === undefined ? 2 : casas);
    if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    return s.replace('.', ',');
  }

  // Lê número digitado com vírgula ou ponto decimal
  function ler(texto) {
    if (typeof texto === 'number') return texto;
    if (texto === null || texto === undefined) return NaN;
    var s = String(texto).trim().replace(/\s/g, '').replace('−', '-');
    if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
    return s === '' ? NaN : Number(s);
  }

  function esc(s) {
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function pct(v, casas) { return num(v * 100, casas === undefined ? 0 : casas) + ' %'; }

  H.util.fmt = { num: num, numU: numU, campo: campo, ler: ler, esc: esc, pct: pct };
})(window.HVAC);

</script>

<script>
/* ==== js/motor/rede.js ==== */
/* Ventilação HVAC Web. Motor (sem DOM): pressões da rede de ambientes (METODOLOGIA, seção 5; P7).
   Nós: os ambientes (0..n−1), o ambiente de referência (−1) e o exterior (−2), os dois a 0 Pa (premissa: sem vento nem efeito chaminé).
   Ambiente "alvo": pressão fixada = pressão do nó de referência dele + s · Δp; a vazão de diferença sai do balanço das frestas.
   Ambiente "livre": vazão de diferença dada (insuflamento − exaustão); a pressão sai do balanço, por Gauss–Seidel com bisseção.
   Fluxo de i para j: Q = 3600 · C_D · A · sinal(p_i − p_j) · √(2 |p_i − p_j| / ρ), em m³/h. */

  'use strict';
  var REF = -1, EXT = -2, TOL = 1e-7, MAX_ITER = 5000;

      if (l.j >= 0) viz[l.j][l.i] = (viz[l.j][l.i] || 0) + l.A;

      mudou = false;
      for (i = 0; i < n; i++) {
        if (det[i]) continue;
        if (nos[i].alvo) { if (detDe(nos[i].ref)) { det[i] = true; mudou = true; } }
        else for (x in viz[i]) if (detDe(+x)) { det[i] = true; mudou = true; break; }
      }

    for (i = 0; i < n; i++) {
      if (det[i]) continue;
      if (nos[i].alvo && emCiclo(nos, i)) erros.push({ i: i, tipo: 'ciclo' });
      else if (!nos[i].alvo && !Object.keys(viz[i]).length) erros.push({ i: i, tipo: 'semDivisa' });

    for (i = 0; i < n; i++) p.push(det[i] ? 0 : NaN);

        if (isNaN(d)) continue;

    }
    function livre(m) {
      var soma = 0, lo = Infinity, hi = -Infinity, y, pv, X, a, b, c, g, q;
      for (y in viz[m]) { pv = pDe(+y); if (isNaN(pv)) continue; soma += viz[m][y]; lo = Math.min(lo, pv); hi = Math.max(hi, pv); }

    for (it = 1; it <= MAX_ITER; it++) {
      var maior = 0, novo;
      for (i = 0; i < n; i++) {

        maior = Math.max(maior, Math.abs(novo - p[i]));

    if (!convergiu) for (i = 0; i < n; i++) if (det[i]) erros.push({ i: i, tipo: 'naoConvergiu' });

    });

      vistos[m] = true; m = nos[m].ref;
    }
    return false;
  }

  H.motor.rede = { REF: REF, EXT: EXT, resolver: resolver };
})(window.HVAC);

<script>
/* ==== js/motor/calculo.js ==== */
/* Ventilação HVAC Web. Motor (sem DOM): cálculo do projeto inteiro. Junta as vazões pela norma (ventilacao.js), as áreas das

      if (a.grupo === 'cozinha' && X.s < 0 && X.alvo && -d.dp < X.dp - C.TOL_SITUACAO) {

    if (a.grupo === 'saude' && l && !vazio(a.ins) && a.ins < N.insPadrao - EPS) add('A11', { qual: 'ins', q: a.ins, min: N.insPadrao, fonte: 'NBR 7256, p. ' + l.pagina });

  function texto(o) {
    return '<div class="campo"><label for="' + o.id + '">' + esc(o.rotulo) + '</label><div class="entrada">' +
      '<input id="' + o.id + '" type="text" autocomplete="off" value="' + esc(o.valor) + '" placeholder="' + esc(o.dica || '') +
      '" data-caminho="' + o.caminho + '" data-tipo="txt"></div>' +

  }

  function seletor(o) {
    var ops = o.opcoes.map(function (op) {
      var v = typeof op === 'string' ? op : op.v, t = typeof op === 'string' ? op : op.t;
      return '<option value="' + esc(v) + '"' + (v === o.valor ? ' selected' : '') + '>' + esc(t) + '</option>';
    }).join('');
    return '<div class="campo"><label for="' + o.id + '">' + esc(o.rotulo) + '</label><div class="entrada">' +
      '<select id="' + o.id + '"' + (o.caminho ? ' data-caminho="' + o.caminho + '" data-tipo="sel"' : '') + (o.acaoSel ? ' data-acao-sel="' + o.acaoSel + '"' : '') + '>' + ops + '</select></div>' +
      '<div class="estado">' + (o.fonte ? selo('norma', o.seloTexto || 'fonte', o.fonte) : '') + '</div>' +
      (o.nota ? '<div class="fraco">' + esc(o.nota) + '</div>' : '') + '</div>';
  }

  function segmentado(o) {
    return '<div class="campo"><span class="rotulo">' + esc(o.rotulo) + '</span><div><div class="seg" role="group" aria-label="' + esc(o.rotulo) + '">' +
      o.opcoes.map(function (op) {
        return '<button type="button" data-acao="' + (o.acao || 'definir') + '" data-caminho="' + o.caminho + '"' + (o.campo ? ' data-campo="' + o.campo + '"' : '') + ' data-valor="' + esc(op.v) + '"' +
          (o.numerico ? ' data-numerico="1"' : '') + (o.booleano ? ' data-booleano="1"' : '') + ' aria-pressed="' + (op.v === o.valor) + '">' + esc(op.t) + '</button>';
      }).join('') + '</div></div>' + (o.fonte ? '<div class="estado">' + selo('norma', 'fonte', o.fonte) + '</div>' : '') + '</div>';
  }

  // Valor calculado: não se edita, e o clique abre a conta
  function calculado(o) {
    return '<div class="campo"><span class="rotulo">' + esc(o.rotulo) + '</span><div>' +
      '<button type="button" class="valor-calc num" data-acao="' + (o.chave ? 'conta' : 'fonte') + '"' +
      (o.chave ? ' data-chave="' + o.chave + '"' : ' data-fonte="' + esc(o.fonte || '') + '"') + '>' + esc(o.valor) +
      (o.unidade ? ' <small>' + esc(o.unidade) + '</small>' : '') + '</button></div>' +
      '<div class="estado">' + selo('calc', 'calculado') + (o.demo ? selo('demo', typeof o.demo === 'string' ? o.demo : 'valor do exemplo') : '') + '</div></div>';
  }

  function passos(lista) {
    return lista.map(function (p) {
      return '<div class="passo"><div class="q"><span>' + esc(p.passo) + '</span><span class="num">' + esc(p.resultado) + '</span></div>' +
        (p.formula ? '<div class="f">' + esc(p.formula) + (p.valores ? ' = ' + esc(p.valores) : '') + '</div>' : '') +
        (p.fonte ? '<div class="fo">' + esc(p.fonte) + '</div>' : '') + '</div>';
    }).join('');
  }

  function aprender(html) {
    return daTela().aprender ? '<div class="aprender"><b>Por quê?</b> ' + html + '</div>' : '';
  }

  // Cabeçalho de tela: linha de contexto, título e texto de apoio (o texto aceita HTML do app)
  function cabeca(sobre, titulo, texto) {
    return '<div class="cabeca"><div class="sobre">' + esc(sobre) + '</div><h1>' + esc(titulo) + '</h1>' + (texto ? '<p>' + texto + '</p>' : '') + '</div>';
  }

  // Indicador: rótulo, valor e, se houver, uma linha de apoio
  function kpi(rotulo, valor, sub) {
    return '<div class="kpi-c"><span>' + rotulo + '</span><b class="num">' + valor + '</b>' + (sub ? '<span class="fraco">' + sub + '</span>' : '') + '</div>';
  }

  /* Bloco recolhível com frase-resumo. id (chave em U.aberto), n (número), titulo, frase, carga (valor à direita), rotuloCarga,

  function bloco(id, n, titulo, frase, carga, rotuloCarga, corpo) {

      '<button type="button" class="bloco-cab" data-acao="bloco" data-bloco="' + id + '" aria-expanded="' + aberto + '">' +
        '<span class="n">' + n + '</span><span><span class="tit">' + titulo + '</span><span class="frase">' + esc(frase) + '</span></span>' +
        '<span class="carga num">' + carga + (rotuloCarga ? '<small>' + rotuloCarga + '</small>' : '') + '</span><span class="seta" aria-hidden="true">›</span>' +
      '</button>' + (aberto ? '<div class="bloco-corpo">' + corpo() + '</div>' : '') + '</section>';
  }

  /* Barras ordenadas da maior para a menor; cada linha abre a conta. lista = [{ chave, nome, valor }]; total = base do percentual;
     unidade = texto depois do valor; casas = casas decimais do valor (padrão 0) */
  function barras(lista, total, unidade, casas) {
    var max = 0, min = 0;
    lista.forEach(function (c) { max = Math.max(max, c.valor); min = Math.min(min, c.valor); });
    var faixa = (max - min) || 1, zero = (-min / faixa) * 100;
    var ordenado = lista.slice().sort(function (a, b) { return b.valor - a.valor; });
    return '<div class="barras">' + ordenado.map(function (c) {
      var larg = Math.abs(c.valor) / faixa * 100;
      var estilo = c.valor >= 0 ? 'left:' + zero.toFixed(2) + '%;width:' + larg.toFixed(2) + '%' : 'left:' + (zero - larg).toFixed(2) + '%;width:' + larg.toFixed(2) + '%';
      return '<div class="linha-b" data-acao="conta" data-chave="' + c.chave + '" role="button" tabindex="0" title="Abrir a conta">' +
        '<span class="nome">' + esc(c.nome) + '</span>' +
        '<span class="trilho"><span class="eixo" style="left:' + zero.toFixed(2) + '%"></span><span class="barra' + (c.valor < 0 ? ' neg' : '') + '" style="' + estilo + '"></span></span>' +
        '<span class="v">' + f.num(c.valor, casas || 0) + (unidade ? ' ' + unidade : '') + '</span><span class="p">' + f.num(c.valor / total * 100, 0) + ' %</span></div>';
    }).join('') + '</div>';
  }

  // Os mesmos passos da gaveta, em tabela, para a folha do memorial
  function tabPassos(lista) {
    return '<table class="passos-t"><thead><tr><th>Passo</th><th>Fórmula e valores</th><th class="num">Resultado</th><th>Fonte</th></tr></thead><tbody>' +
      lista.map(function (p) {
        return '<tr><td>' + esc(p.passo) + '</td><td class="f">' + esc(p.formula) + (p.valores ? ' = ' + esc(p.valores) : '') + '</td><td class="num">' + esc(p.resultado) + '</td><td>' + esc(p.fonte) + '</td></tr>';
      }).join('') + '</tbody></table>';
  }

  /* Lista de cartões do celular (v0.4.0): oculta no computador (o app desenha também a tabela, marcada com .so-computador).
     itens = [{ href (tela que o cartão abre; sem href o cartão não é link), titulo, sub (texto depois do título),
     valores: [{ r (rótulo), v (valor já formatado), u (unidade) }] (valor vazio ou "—" não aparece), situacao (HTML do app),
     destaque (bool: barra lateral, como o circuito crítico) }] */
  function cartoes(itens) {
    return '<ul class="cel-cartoes">' + itens.map(function (x) {
      var vals = (x.valores || []).filter(function (v) { return v && v.v !== undefined && v.v !== null && v.v !== '' && v.v !== '—'; }).map(function (v) {
        return '<span><small>' + esc(v.r) + '</small>' + esc(v.v) + (v.u ? ' ' + esc(v.u) : '') + '</span>';
      }).join('');
      var tag = x.href ? 'a' : 'div', corpo = '<span class="cel-c-tit"><b>' + esc(x.titulo) + '</b>' + (x.sub ? ' <span>· ' + esc(x.sub) + '</span>' : '') + '</span>' +
        (x.href ? '<span class="cel-c-seta" aria-hidden="true">›</span>' : '') + (vals ? '<span class="cel-c-vals num">' + vals + '</span>' : '') +
        (x.situacao ? '<span class="cel-c-sit">' + x.situacao + '</span>' : '');
      return '<li><' + tag + ' class="cel-cartao' + (x.destaque ? ' destaque' : '') + '"' + (x.href ? ' href="' + esc(x.href) + '"' : '') + '>' + corpo + '</' + tag + '></li>';
    }).join('') + '</ul>';
  }

  H.ui.c = { selo: selo, campo: campo, texto: texto, seletor: seletor, segmentado: segmentado, calculado: calculado, passos: passos, aprender: aprender,
             cabeca: cabeca, kpi: kpi, bloco: bloco, barras: barras, tabPassos: tabPassos, cartoes: cartoes };
})(window.HVAC);

</script>
<script>
/* ==== plataforma v0.8.0: js/interface/casca.js ==== */
/* Plataforma HVAC. Casca comum dos apps: estado, armazenamento, rotas, trilha, faixa de resultado, gaveta, janela, paleta de comandos,

(function (H) {

  var E = null;                               // projeto (o que vai para o arquivo)
  var U = H.ui.U = {                          // estado da tela (não vai para o arquivo); o app acrescenta os seus campos em H.app.estado

  var clicarDepois = null;                    // seletor do parâmetro de teste ?clicar=, à espera do próximo desenho
  var digitarDepois = null;                   // "<id>:<valor>" do parâmetro de teste ?digitar=, à espera do próximo desenho
  var despejar = false;                       // parâmetro de teste ?despejar=1: o texto do arquivo vai para a página a cada desenho
  function tem(o, k) { return !!o && Object.prototype.hasOwnProperty.call(o, k); }

  // ------------------------------------------------------------ armazenamento (o app funciona sem ele)
  function guardar() { try { localStorage.setItem(A.chave, JSON.stringify(E)); } catch (e) { /* sem armazenamento: segue em memória */ } }
  function guardarPref() { try { localStorage.setItem(CHAVE_PREF, JSON.stringify({ aprender: U.aprender, tema: U.tema })); } catch (e) { /* idem */ } }
  function contar(rel, nivel) { var n = 0; rel.forEach(function (x) { if (x.nivel === nivel) n++; }); return n; }
  // O relatório abre sozinho quando o arquivo veio de formato anterior ou quando algum valor foi substituído
  function pedeRelatorio(r) { return r.versaoOrigem < A.arquivo.versao || contar(r.relatorio, 'substituido') > 0; }
  function carregar() {
    try {
      var p = JSON.parse(localStorage.getItem(CHAVE_PREF) || 'null');
      if (p) { U.aprender = !!p.aprender; U.tema = p.tema === 'escuro' ? 'escuro' : 'claro'; }
      else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) U.tema = 'escuro';
      var s = JSON.parse(localStorage.getItem(A.chave) || 'null');
      if (s) {
        var r = A.arquivo.abrir(s);

          return r.projeto;

  // ------------------------------------------------------------ importação (arquivo de projeto e parâmetro de teste ?importar=)
  function fmtQuando() {
    var d = new Date(), z = function (n) { return ('0' + n).slice(-2); };

  }

  }
  /* Abre o projeto lido do texto do arquivo. opc.semGuardar: não grava no localStorage (parâmetro de teste); opc.irParaProjeto: navega

  var SELO_NIVEL = { substituido: ' <span class="selo alterado">alterado</span>', mantido: ' <span class="selo mantido">mantido</span>' };
  var NIVEL_TXT = { info: 'INFO', convertido: 'CONVERTIDO', mantido: 'MANTIDO', substituido: 'SUBSTITUÍDO' };
  var BOTOES_REL = '<div class="acoes" style="margin-top:12px"><button class="botao prim" data-acao="fechar">Fechar</button><button class="botao" data-acao="salvar-relatorio">Salvar relatório (.txt)</button></div>';
  function htmlLinhas(rel) {
    return '<div class="tabela-rolo" style="max-height:52vh;overflow:auto"><table><thead><tr><th>Onde</th><th>Campo</th><th>No arquivo</th><th>Adotado</th><th>Motivo</th></tr></thead><tbody>' +
      rel.map(function (x) {
        return '<tr><td>' + esc(x.onde) + '</td><td>' + esc(x.campo) + (tem(SELO_NIVEL, x.nivel) ? SELO_NIVEL[x.nivel] : '') + '</td><td>' + esc(x.valorArquivo) + '</td><td>' +

      }).join('') + '</tbody></table></div>';

  // "N conversões · N valores seus mantidos · N substituições"; o trecho dos mantidos só aparece quando há algum
  function contagem(rel) {
    var nc = contar(rel, 'convertido'), nm = contar(rel, 'mantido'), ns = contar(rel, 'substituido');
    return nc + (nc === 1 ? ' conversão' : ' conversões') + (nm ? ' · ' + nm + (nm === 1 ? ' valor seu mantido' : ' valores seus mantidos') : '') +
      ' · ' + ns + (ns === 1 ? ' substituição' : ' substituições');
  }
  function htmlImportacao() {
    var im = U.importacao, rel = im.relatorio;
    return '<h2>Relatório de importação</h2><p class="suave" style="margin-bottom:10px">Arquivo <b>' + esc(im.nome) + '</b> · formato da versão ' + im.versaoOrigem + ' → ' + A.arquivo.versao + ' · ' +
      contagem(rel) + ' · ' + esc(im.quando) + '</p>' +
      (rel.length ? htmlLinhas(rel) : '<p>Nenhuma alteração foi necessária.</p>') + BOTOES_REL;
  }
  /* Relatório avulso (H.ui.api.relatorio): a mesma janela do relatório do arquivo de projeto, para qualquer importação do app.
     r = { linhas, titulo, nome (arquivo de origem), resumo (frase em destaque), texto (conteúdo do .txt), arquivoTxt (nome do .txt), manter } */
  function htmlRelatorio(r) {
    return '<h2>' + esc(r.titulo) + '</h2><p class="suave" style="margin-bottom:10px">' + (r.nome ? 'Arquivo <b>' + esc(r.nome) + '</b> · ' : '') + contagem(r.linhas) + ' · ' + esc(r.quando) + '</p>' +
      (r.resumo ? '<p style="margin-bottom:10px"><b>' + esc(r.resumo) + '</b></p>' : '') +
      (r.linhas.length ? htmlLinhas(r.linhas) : (r.resumo ? '' : '<p>Nenhuma alteração foi necessária.</p>')) + BOTOES_REL;

  function salvarRelatorio() {
    var av = U.sobre && U.sobre.relatorio;
    if (av) { baixar('﻿' + (typeof av.texto === 'string' ? av.texto : textoRelatorioAvulso(av)), 'text/plain;charset=utf-8', av.arquivoTxt || nomeTxt(av.nome || 'relatorio')); return; }
    var im = U.importacao; if (!im) return;

      String(im.nome).replace(/\.json$/i, '').replace(/[^\wÀ-ú]+/g, '_') + '_relatorio_importacao.txt');

  // ------------------------------------------------------------ rotas: #/tela/indice?chave=valor
  /* Parâmetros de endereço da casca (usados em testes e capturas): importar, bloco, tema, aprender, conta, clicar, digitar, despejar,
     memorial (v0.8.0: "resumido" mostra a folha resumida, para conferir e gerar o PDF por --print-to-pdf).
     Os do app ficam em A.parametros = { nome: function (valor, U) }; se o app declara "clicar", "digitar" ou "despejar", vale o dele
     e a casca não age nesse parâmetro. */
  function lerRota() {
    var h = (location.hash || '#/inicio').replace(/^#\/?/, ''), partes = h.split('?');
    var seg = partes[0].split('/');
    U.tela = tem(A.rotas, seg[0]) ? seg[0] : 'inicio';
    var rota = A.rotas[U.tela];
    if (rota.indice) U[rota.indice] = Math.max(0, parseInt(seg[1], 10) || 0);
    U.temIndice = !!rota.indice && /^\d+/.test(seg[1] || '');   // "#/rota/N" trouxe o índice; "#/rota" não (U[rota.indice] vale 0 nos dois casos)
    (partes[1] || '').split('&').forEach(function (par) {
      var ig = par.indexOf('='), kv = ig < 0 ? [par, ''] : [par.slice(0, ig), par.slice(ig + 1)];
      if (kv[0] === 'importar') {   // parâmetro de teste: JSON em base64 (UTF-8); passa pela mesma importação, sem gravar no localStorage

  // ?digitar=<id do campo>:<valor>: escreve o valor no elemento e dispara o evento de alteração, que é o caminho de quem digita na tela;
  // texto sem ":" ou elemento ausente são ignorados

  function despejo() {

  function clicar(valor) {

  /* Faixa de resultado, só nas rotas com faixa: true. A.faixa(E, R, U) devolve

  function htmlFaixa(R) {

  // Camada sobre a tela: gaveta (fonte ou conta), janela (modelos, relatório, ajuda), paleta de comandos

  /* Gerar PDF (v0.7.0): com A.faltaPreencher(E, R) → [{ onde, texto, rota }] não vazio, abre a janela "Falta preencher" (lista,

  function imprimir(depois) {   // depois: espera o desenho que fecha a janela

  function htmlFaltaPreencher(L) {

        return '<li style="margin:4px 0">' + (x.onde ? esc(x.onde) + ': ' : '') + esc(x.texto) + '.' +
          (x.rota ? ' <a href="' + esc(x.rota) + '" data-acao="pdf-ir" data-i="' + i + '">Abrir</a>' : '') + '</li>';

      '<button type="button" class="botao prim" data-acao="pdf-completo">Completo</button>' +

  /* Texto do arquivo de projeto como é salvo: o projeto, o envelope (formato, versaoFormato, versaoApp e, logo depois, versaoPlataforma)
     e os blocos que A.arquivo.aoSalvar(E, R) devolver (ex.: { resultados: {...} }). Os blocos entram só nesta cópia: E não os recebe.
     Bloco com nome de chave do envelope é ignorado. Se aoSalvar lançar erro, o arquivo sai sem os blocos e o erro aparece na página. */
  var ENVELOPE = ['formato', 'versaoFormato', 'versaoApp', 'versaoPlataforma'];
  function textoArquivo() {
    var obj = {}, blocos = null, k;
    E.formato = A.arquivo.formato; E.versaoFormato = A.arquivo.versao; E.versaoApp = H.versao;
    for (k in E) {
      if (!tem(E, k) || k === 'versaoPlataforma') continue;
      obj[k] = E[k];
      if (k === 'versaoApp') obj.versaoPlataforma = H.plataforma.versao;
    }

      try { blocos = A.arquivo.aoSalvar(E, A.calcular ? A.calcular(E) : null); }
      catch (e) { blocos = null; setTimeout(function () { throw e; }, 0); }
    }
    if (blocos && typeof blocos === 'object') for (k in blocos) if (tem(blocos, k) && ENVELOPE.indexOf(k) < 0) obj[k] = blocos[k];

  function salvarArquivo() {
    var nome = A.arquivo.nome ? A.arquivo.nome(E) : (E.projeto.nome || 'projeto').replace(/[^\wÀ-ú]+/g, '_') + '_' + E.projeto.revisao + '.json';
    baixar(textoArquivo(), 'application/json', nome);
  }

  // ------------------------------------------------------------ alterações do projeto
  /* Caminho de um campo: "projeto.x.y" ou "amb.N.x.y" (N = índice em E.ambientes). App com outra raiz declara A.alvo(caminho, E) -> { o, k }. */
  function alvo(caminho) {
    if (A.alvo) return A.alvo(caminho, E);
    var ps = caminho.split('.'), o = ps[0] === 'amb' ? E.ambientes[+ps[1]] : E.projeto;
    for (var i = ps[0] === 'amb' ? 2 : 1; i < ps.length - 1; i++) o = o[ps[i]];
    return { o: o, k: ps[ps.length - 1] };
  }
  /* A.medida(E): o número cuja variação a faixa mostra; A.aoAlterar(caminho, E, anterior): ajustes em cadeia do app depois de cada
     alteração; anterior é o valor que o campo tinha antes dela (objeto ou lista: a mesma referência, sem cópia) */
  function alterar(caminho, fn) {
    var antes = A.medida ? A.medida(E) : 0;
    var t = alvo(caminho), anterior = t.o ? t.o[t.k] : undefined;
    fn(t);
    if (A.aoAlterar) A.aoAlterar(caminho, E, anterior);
    U.delta = A.medida ? A.medida(E) - antes : 0;
    guardar();
  }

  document.addEventListener('change', function (ev) {
    var el = ev.target, caminho = el.getAttribute && el.getAttribute('data-caminho');
    if (el.id === 'arquivo') return abrirArquivo(el);
    // seletor de arquivo de projeto de qualquer lugar (Menu do celular ou tela do app), marcado com data-arquivo-projeto (v0.4.0)
    if (el.hasAttribute && el.hasAttribute('data-arquivo-projeto') && el.type === 'file') { if (U.sobre && U.sobre.menu) U.sobre = null; return abrirArquivo(el); }
    // data-acao-sel: a ação do seletor no lugar da gravação do campo; não exige data-caminho (seletor que só muda o estado da tela)
    var acaoSel = el.getAttribute && el.getAttribute('data-acao-sel');
    if (acaoSel && acao(acaoSel)) { el.setAttribute('data-valor', el.value); acao(acaoSel)(el); setTimeout(function () { desenhar(el.id || null); }, 0); return; }
    if (!caminho) return;
    var tipo = el.getAttribute('data-tipo'), comSinal = el.hasAttribute('data-negativo');   // data-negativo: o campo aceita número abaixo de zero
    alterar(caminho, function (t) {
      if (tipo === 'txt' || tipo === 'sel') { t.o[t.k] = el.value; return; }
      var txt = el.value.trim();
      if (txt === '') {
        if (el.hasAttribute('data-anulavel')) { t.o[t.k] = null; delete U.erros[el.id]; }
        else U.erros[el.id] = 'Preencha este campo.';
        return;
      }
      var v = f.ler(txt);
      if (isNaN(v) || (v < 0 && !comSinal)) {
        U.erros[el.id] = comSinal ? 'Digite um número (use vírgula para decimais).' : 'Digite um número maior ou igual a zero (use vírgula para decimais).';
        return;
      }

      // A.ajustar(caminho, v, E): valor final (o app pode limitar o valor e acertar campos ligados a ele)
      if (A.ajustar) v = A.ajustar(caminho, v, E);

    setTimeout(function () {
      var ativo = document.activeElement;
      desenhar(ativo && ativo.id && ativo !== document.body ? ativo.id : null);
    }, 0);
  });

  function abrirArquivo(el) {
    var arq = el.files && el.files[0];
    if (!arq) return;
    var leitor = new FileReader();
    leitor.onload = function () {
      var abriu = importarTexto(String(leitor.result).replace(/^﻿/, ''), arq.name, { irParaProjeto: true });
      if (!abriu || !U.mostrarImportacao) desenhar();   // com navegação, o redesenho vem do hashchange
      el.value = '';

  }

  // Ações da casca (data-acao). As do app ficam em A.acoes e têm precedência; a do app pode chamar a da casca por H.ui.api.acoes.
  var ACOES = {
    fonte: function (el) { abrirFonte(el.getAttribute('data-fonte')); },
    conta: function (el) { abrirConta(el.getAttribute('data-chave')); },
    fechar: function () { U.sobre = null; },
    bloco: function (el) { var b = el.getAttribute('data-bloco'); U.aberto[b] = !U.aberto[b]; },
    voltar: function (el) { alterar(el.getAttribute('data-caminho'), function (t) { t.o[t.k] = null; }); return null; },
    definir: function (el) {

    },
    'ver-importacao': function () { if (U.importacao) U.sobre = { tipo: 'janela', html: htmlImportacao() }; },
    'salvar-relatorio': salvarRelatorio,

    aprender: function () { U.aprender = !U.aprender; guardarPref(); },
    tema: function () { U.tema = U.tema === 'escuro' ? 'claro' : 'escuro'; guardarPref(); },
    paleta: function () { U.sobre = { tipo: 'paleta', busca: '', sel: 0 }; return 'paleta-busca'; },
    comando: function (el) { var c = comandosFiltrados()[+el.getAttribute('data-i')]; U.sobre = null; if (c) c.fn(); },
    pdf: gerarPdf,
    'pdf-assim': function () { escolherVersao(true); },                               // v0.7.0: janela "Falta preencher"
    'pdf-completo': function () { imprimirVersao(false); },                           // v0.8.0: janela "Gerar PDF"
    'pdf-resumido': function () { imprimirVersao(true); },
    'pdf-ir': function (el) {

    },
    salvar: salvarArquivo,
    'abrir-arquivo': function () { document.getElementById('arquivo').click(); },
    ajuda: function () { if (A.ajuda && A.ajuda.length) U.sobre = { tipo: 'janela', html: htmlAjuda() }; },
    menu: function () { U.sobre = { tipo: 'janela', html: htmlMenu(), menu: true }; },        // celular (v0.4.0)
    passos: function () { U.sobre = { tipo: 'janela', html: htmlListaPassos() }; },           // celular: lista dos passos

    exemplo: function () {
      if (window.confirm('Substituir o projeto aberto pelo exemplo?')) { E = A.arquivo.exemplo(); U.delta = 0; U.erros = {}; guardar(); }
    }
  };
  function acao(nome) { return tem(A.acoes, nome) ? A.acoes[nome] : tem(ACOES, nome) ? ACOES[nome] : null; }

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest ? ev.target.closest('[data-acao]') : null;

  document.addEventListener('keydown', function (ev) {

  document.addEventListener('input', function (ev) {

  window.addEventListener('hashchange', function () {

<script>
/* ==== js/interface/contas.js ==== */
/* Ventilação HVAC Web. Interface: unidade de vazão da tela, nomes, textos dos avisos e dos erros (aprovados pelo Francisco em
   2026-11-23, gerados\TELAS_v0.1.0_proposta.md da sessão E2) e os passos de cada conta (os mesmos na gaveta e no memorial).

(function (H) {
  'use strict';
  var f = H.util.fmt, V = H.motor.vent, F = V.F, K = V.C, vazio = V.vazio;
  var T = function () { return H.dados.t; };

  function casasQ(E) { return emLs(E) ? 1 : 0; }
  function qv(E, v) { return v === null || v === undefined ? v : emLs(E) ? v / 3.6 : v; }   // m³/h → unidade da tela
  function fq(E, v) { return f.num(qv(E, v), casasQ(E)); }

  function x36(E) { return emLs(E) ? '' : ' × 3,6'; }
  function d36(E) { return emLs(E) ? ' ÷ 3,6' : ''; }
  function kS(E) { return emLs(E) ? '1.000' : '3.600'; }
  function fp(v) { return f.num(v, 2); }   // pressão
  function sinalP(v) { return (v > 0.005 ? '+' : '') + fp(v); }
  // taxa por peça da Tab. 2: período de uso (nota 4) ou operação (notas 5 e 7)
  function usoTxt(a, N) { return N.nota4 ? (N.usoIntenso ? 'uso intenso' : 'fora do uso intenso') : 'operação ' + (a.operacao === 'intermitente' ? 'intermitente' : 'contínua'); }

  // ------------------------------------------------------------ nomes
  var GRUPOS = [
    { v: 'geral', t: 'Geral (NBR 16401-3)' }, { v: 'cozinha', t: 'Cozinha profissional (NBR 14518)' },
    { v: 'saude', t: 'Saúde (NBR 7256)' }, { v: 'tic', t: 'Sala de TIC (NBR 17207)' }
  ];
  var SIT = { atende: 'Atende', abaixo: 'Abaixo do exigido', invertido: 'Sentido invertido', erro: 'Sem cálculo' };
  var REL = { positiva: 'Positiva', negativa: 'Negativa', neutra: 'Neutra' };
  var ESTILOS = [{ v: 'parede', t: 'Parede' }, { v: 'ilha', t: 'Ilha simples' }, { v: 'ilhaDupla', t: 'Ilha dupla' }];
  var CLASSES = [{ v: 'leve', t: 'Leve' }, { v: 'moderado', t: 'Moderado' }, { v: 'severo', t: 'Severo' }, { v: 'solido', t: 'Combustível sólido' }];
  function nomeGrupo(g) { var x = GRUPOS.filter(function (o) { return o.v === g; })[0]; return x ? x.t : g; }
  function nomeTipo(a) {
    if (a.grupo === 'geral') return (T().tab2Por[a.tipo] || {}).nome || '—';
    if (a.grupo === 'saude') return (T().anexoAPor[a.tipo] || {}).nome || '—';
    return a.grupo === 'cozinha' ? 'Cozinha profissional' : 'Sala de TIC';
  }
  function nomeClasse(c) { var x = CLASSES.filter(function (o) { return o.v === c; })[0]; return x ? x.t.toLowerCase() : c; }

      case 'A2': return 'Pressão da cozinha de ' + fp(d.dpRes) + ' Pa; a norma pede no mínimo ' + f.num(d.dp, 1) + ' Pa negativos em relação aos ambientes vizinhos (' + d.fonte + '). Aumente a exaustão ou reduza as frestas.';
      case 'A3': return 'Vazão de diferença menor que a tolerância de balanceamento (±' + f.num(d.tol, 0) + ' % no insuflamento e na exaustão): o ajuste em campo pode inverter a pressão. Confira.';

<script>

        r.divisas.map(function (d) { return { c: [esc(d.vizNome), esc(d.area.nome), f.num(d.A, 4), W.sinalP(d.dp), W.fq(E, d.Q)] }; }));
      if (r.erros.length) return '<h3>' + esc(a.nome) + '</h3>' + divs;
      return '<h3>' + esc(a.nome) + '</h3>' + divs + C.tabPassos(L.concat(W.passos('dq', E, R, i).lista, W.passos('p', E, R, i).lista,
        a.grupo === 'cozinha' && r.vVao !== null && r.vVao !== undefined ? W.passos('vao', E, R, i).lista : []));
    }).join('');
  }
  function topico4(E, R) {
    var un = W.un(E);
    return '<h2>4. Balanço de ar</h2>' +
      tabela([['Ambiente'], ['Em relação a'], ['Pressão exigida (Pa)', 1], ['Pressão resultante (Pa)', 1], ['Insuflamento (' + un + ')', 1], ['Exaustão (' + un + ')', 1],
              ['Transferência (' + un + ')', 1], ['Vazão de diferença (' + un + ')', 1], ['Situação']],
        X.linhasBalanco(E, R).map(function (x) {
          var r = x.r;
          return { c: [esc(x.a.nome), esc(r.refNome), W.exigidaTxt(r.X), W.sinalP(r.dpRes), W.fq(E, r.ins), W.fq(E, r.exa), W.fq(E, r.transf), W.fq(E, r.dQ), esc(W.SIT[r.situacao])] };
        }).concat([{ total: true, c: ['Total', '', '', '', W.fq(E, R.totais.ins), W.fq(E, R.totais.exa), '', W.fq(E, R.totais.ins - R.totais.exa), ''] }]));
  }
  function folha(E, R) {
    var p = E.projeto, plat = H.plataforma && H.plataforma.versao ? ' · plataforma ' + H.plataforma.versao : '';
    return '<article class="folha">' +
      '<div class="cab-f"><div><h1>Memorial de cálculo de ventilação e pressões</h1><div>' + esc(p.nome || 'Projeto sem nome') + (p.cliente ? ' · ' + esc(p.cliente) : '') + (p.local ? ' · ' + esc(p.local) : '') + '</div></div>' +
        '<div>Revisão ' + esc(p.revisao || '—') + '<br>Emitido em ' + hoje() + '<br>Ventilação HVAC v' + esc(H.versao || '') + esc(plat) + '</div></div>' +
      topico1(E, R) + topico2(E, R) + topico3(E, R) + topico4(E, R) + '</article>';
  }

  /* 0.5.0 (plataforma 0.8.0): memorial resumido, só resultados: identificação, balanço de ar e tabela de divisas por ambiente.
     Sem bases, premissas, passos de conta, notas nem avisos. */
  function topico1Resumo(E) {
    var p = E.projeto;
    return '<h2>1. Identificação</h2>' +
      tabela([['Obra'], ['Cliente'], ['Local'], ['Responsável técnico'], ['Revisão']], [{ c: [esc(p.nome || '—'), esc(p.cliente || '—'), esc(p.local || '—'), esc(p.responsavel || '—'), esc(p.revisao || '—')] }]);
  }
  function topico3Resumo(E, R) {
    var un = W.un(E);
    return '<h2>3. Frestas e pressões</h2>' + E.ambientes.map(function (a, i) {
      var r = R.amb[i];
      return '<h3>' + esc(a.nome) + '</h3>' + tabela([['Vizinho'], ['Divisa'], ['Área de vazamento (m²)', 1], ['Diferença de pressão (Pa)', 1], ['Vazão que sai (' + un + ')', 1]],
        r.divisas.map(function (d) { return { c: [esc(d.vizNome), esc(d.area.nome), f.num(d.A, 4), W.sinalP(d.dp), W.fq(E, d.Q)] }; }));
    }).join('');
  }
  function folhaResumida(E, R) {
    var p = E.projeto, plat = H.plataforma && H.plataforma.versao ? ' · plataforma ' + H.plataforma.versao : '';
    return '<article class="folha" data-resumo="1">' +
      '<div class="cab-f"><div><h1>Memorial de cálculo resumido de ventilação e pressões</h1><div>' + esc(p.nome || 'Projeto sem nome') + (p.cliente ? ' · ' + esc(p.cliente) : '') + (p.local ? ' · ' + esc(p.local) : '') + '</div></div>' +
        '<div>Revisão ' + esc(p.revisao || '—') + '<br>Emitido em ' + hoje() + '<br>Ventilação HVAC v' + esc(H.versao || '') + esc(plat) + '</div></div>' +
      '<p>Método, premissas e contas: memorial completo da mesma revisão.</p>' +
      topico1Resumo(E) + topico4(E, R).replace('<h2>4. Balanço de ar</h2>', '<h2>2. Balanço de ar</h2>') + topico3Resumo(E, R) + '</article>';
  }

  X.memorial = function (E, U, R) {
    return '<div class="nao-imprime">' + C.cabeca('Passo 4 de 4', 'Memorial', 'A folha para imprimir.') +
      '<div class="acoes" style="margin-bottom:16px"><button class="botao prim" data-acao="pdf">Gerar PDF</button><button class="botao" data-acao="salvar">Salvar projeto</button>' +
        '<a class="botao leve" href="#/referencias">Ver referências</a></div>' + '</div>' + (U.memorial === 'resumido' ? folhaResumida(E, R) : folha(E, R));
  };
})(window.HVAC);

</script>
<script>
/* ==== js/interface/app.js ==== */
/* Ventilação HVAC Web. Manifesto H.app para a casca da plataforma HVAC: rotas, trilha, faixa, contas, arquivo de projeto, ações
   (ambientes, divisas, novo projeto, exportar vazões) e as regras de alteração (unidade de vazão, troca de grupo ou de tipo). */
(function (H) {
  'use strict';
  var f = H.util.fmt, W = H.ui.vent, X = H.ui.telas, M = H.motor.formato, V = H.motor.vent, Kc = H.ui.api, U = H.ui.U, vazio = V.vazio;
  var T = function () { return H.dados.t; };
  function calc(E) { return H.motor.calculo.calcular(E); }
  function proj() { return Kc.projeto(); }

  function baixar(texto, nome) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([texto], { type: 'application/json' }));
    a.download = nome;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }
  function nomeArq(t) { return String(t || 'projeto').replace(/[^\wÀ-ú]+/g, '_'); }

  // ------------------------------------------------------------ ações de ambiente e de divisa
  function incluirAmb() {
    var E = proj(), n = E.ambientes.length;
    E.ambientes.push(M.ambienteNovo(M.proximoId(E), 'Ambiente ' + (n + 1)));
    Kc.guardar();
    location.hash = '#/ambiente/' + n;
  }
  function duplicarAmb(i) {
    var E = proj(), c = JSON.parse(JSON.stringify(E.ambientes[i]));
    c.id = M.proximoId(E); c.nome = c.nome + ' (cópia)';
    E.ambientes.splice(i + 1, 0, c);
    Kc.guardar();
    location.hash = '#/ambiente/' + (i + 1);
  }
  function apagarAmb(i) {
    var E = proj(), a = E.ambientes[i];
    if (E.ambientes.length < 2 || !window.confirm('Apagar o ambiente “' + a.nome + '”? As divisas com ele também são apagadas.')) return;
    E.ambientes.splice(i, 1);
    E.ambientes.forEach(function (b) {
      if (b.ref === a.id) b.ref = null;
      b.divisas = b.divisas.filter(function (d) { return d.vizinho !== a.id; });
    });
    U.delta = 0; Kc.guardar();
    location.hash = '#/ambientes';
  }
  function novoProjeto() {
    var E = proj(), x;
    if (!window.confirm('Começar um projeto novo? O projeto aberto será substituído.')) return;
    x = M.exemplo();
    x.projeto.nome = 'Projeto sem nome'; x.projeto.local = '';
    E.projeto = x.projeto;
    E.ambientes = [M.ambienteNovo('a1', 'Ambiente 1')];
    U.delta = 0; U.erros = {}; U.importacao = null; Kc.guardar();
    location.hash = '#/projeto';
  }
  function exportar() {
    var E = proj(), R = calc(E);
    baixar(JSON.stringify(M.exportar(E, R), null, 2), 'Vazoes_' + nomeArq(E.projeto.nome) + '_' + nomeArq(E.projeto.revisao) + '.json');
    U.exportou = true;
  }

  // ------------------------------------------------------------ regras de alteração
  var PADRAO_TIPO = { geral: 'banheiro-publico', cozinha: '', tic: '' };
  function limparNorma(a) {
    ['renH', 'movH', 'exaustaoTotal', 'ins', 'exa', 'exaGeral', 'relacao', 'dp', 'modo', 'periodo'].forEach(function (k) { a[k] = null; });
    a.aerossois = false;
  }
  function pecasFixas(a) {
    var t = T().tab2Por[a.tipo];
    if (a.grupo === 'geral' && t && (t.unidade === 'banheiro' || t.unidade === 'cozinha')) a.pecas = 1;   // 1 por ambiente (Tab. 2, notas 5 e 7)
  }
  function aoAlterar(caminho, E, anterior) {
    var ps = caminho.split('.'), k = ps[ps.length - 1], a, novo;
    U.exportou = false;
    if (ps[0] === 'projeto') {
      if (k === 'referencia' && !String(E.projeto.referencia || '').trim()) E.projeto.referencia = 'Corredor';
      if (k === 'unidade') U.erros = {};
      return;
    }
    a = E.ambientes[+ps[1]];
    if (!a) return;
    if (ps.length === 3) {
      novo = a[k];
      if (k === 'grupo' && novo !== anterior) {
        a.tipo = novo === 'saude' ? T().anexoA[0].id : PADRAO_TIPO[novo];
        limparNorma(a);
        a.pecas = novo === 'geral' ? 1 : 0;
        if (novo !== 'geral') a.local = '';
      }
      if (k === 'tipo' && novo !== anterior) { limparNorma(a); pecasFixas(a); }
      if ((k === 'relacao' || k === 'ref' || k === 'modo') && novo === '') a[k] = null;
      // valor escolhido igual ao padrão: volta a "padrão" (acompanha a norma se o tipo mudar)
      if (k === 'relacao' || k === 'modo' || k === 'exaustaoTotal') {
        var N = V.vazoesNorma(a), Xg = V.exigencia(Object.assign({}, a, { relacao: null, modo: null }), N);
        if (k === 'relacao' && a.relacao === Xg.relPadrao) a.relacao = null;
        if (k === 'modo' && a.modo === Xg.modoPadrao) a.modo = null;
        if (k === 'exaustaoTotal') { var s2 = V.saude(Object.assign({}, a, { exaustaoTotal: null })); if (s2.linha && a.exaustaoTotal === s2.exaTot) a.exaustaoTotal = null; }
      }
      // relação neutra não tem pressão exigida digitada
      if (k === 'relacao' && a.relacao === 'neutra') a.dp = null;
      if (k === 'periodo' && a.periodo === 'intenso') a.periodo = null;   // padrão da nota 4
      return;
    }
    if (ps[2] === 'coifa') {
      if (k === 'classe' && a.coifa.classe === '') a.coifa.classe = null;
      if (k === 'estilo' && a.coifa.estilo !== anterior) a.coifa.v1 = null;
      return;
    }
    if (ps[2] === 'divisas' && k === 'tipo' && a.divisas[+ps[3]].tipo !== anterior) {
      var d = a.divisas[+ps[3]];
      d.largura = null; d.altura = null; d.folgaLat = null; d.folgaInf = null; d.area = null;
    }
  }

  // ------------------------------------------------------------ manifesto
  H.app = {
    id: 'ventilacao',
    nome: 'Ventilação HVAC',
    rotuloVersao: 'v' + (H.versao || ''),
    chave: 'hvac.ventilacao.v1',
    paletaDica: 'Digite um comando ou o nome de um ambiente',
    estado: { amb: 0, aberto: { uso: true, vaz: true, div: true, pre: true }, exportou: false },

    rotas: {
      inicio: { tela: X.inicio },
      projeto: { tela: X.projeto },
      ambientes: { tela: X.ambientes, larga: true },
      ambiente: { tela: X.ambiente, indice: 'amb', passo: 'ambientes', faixa: true, larga: true },
      balanco: { tela: X.balanco, larga: true },
      memorial: { tela: X.memorial, larga: true, imprime: true },
      referencias: { tela: X.referencias, larga: true }
    },

    trilha: [
      { r: 'projeto', t: 'Projeto', s: function (E) { return E.projeto.nome || 'sem nome'; } },
      { r: 'ambientes', t: 'Ambientes', s: function (E) { return X.plural(E.ambientes.length, 'ambiente', 'ambientes'); } },
      { r: 'balanco', t: 'Balanço', s: function (E, R) { var n = R.amb.filter(function (r) { return r.situacao !== 'atende'; }).length; return n ? X.plural(n, 'ambiente a ver', 'ambientes a ver') : 'todos atendem'; },
        pend: function (E, R) { return R.amb.some(function (r) { return r.situacao !== 'atende'; }); } },
      { r: 'memorial', t: 'Memorial', s: function (E, R) { var n = X.faltaPreencher(E, R).length; return n ? X.plural(n, 'item a preencher', 'itens a preencher') : 'pronto para emitir'; } }
    ],
    // plataforma 0.7.0: o que falta preencher abre a janela da casca ao gerar o PDF (memorial.js)
    faltaPreencher: function (E, R) { return X.faltaPreencher(E, R); },
    // plataforma 0.8.0: "Gerar PDF" pergunta Completo ou Resumido (memorial.js, folhaResumida)
    memorialResumido: true,

    calcular: calc,

    faixa: function (E, R, U2) {
      var r = R.amb[U2.amb];
      if (!r) return null;
      return {
        itens: [
          { rotulo: 'Insuflamento', valor: W.fqu(E, r.ins) },
          { rotulo: 'Exaustão', valor: W.fqu(E, r.exa) },
          { rotulo: 'Vazão de diferença', valor: W.fqu(E, r.dQ), sec: true },
          { rotulo: 'Pressão resultante', valor: W.sinalP(r.dpRes) + ' Pa' },
          { rotulo: 'Situação', valor: W.SIT[r.situacao] || '' }
        ],
        delta: '',
        link: { href: '#/balanco', texto: 'Ver balanço' }
      };
    },

    conta: W.conta,

    arquivo: {
      formato: M.FORMATO,
      versao: M.VERSAO,
      abrir: M.abrir,
      textoRelatorio: M.textoRelatorio,
      exemplo: M.exemplo
    },

    comandos: function (E) {
      return [{ t: 'Ir para Referências', fn: function () { location.hash = '#/referencias'; } }].concat(
        E.ambientes.map(function (a, i) { return { t: 'Abrir ambiente: ' + a.nome, fn: function () { location.hash = '#/ambiente/' + i; } }; }));
    },
    atalhos: [
      { tecla: 'd', quando: function (U2) { return U2.tela === 'ambiente'; }, fn: function (E, U2) { duplicarAmb(U2.amb); } }
    ],

    validar: function (caminho, v) {
      if (/\.(area|peDireito)$/.test(caminho) && !(v > 0)) return 'Digite um número maior que zero (use vírgula para decimais).';
      if (/^projeto\.cd$/.test(caminho) && !(v > 0 && v <= 1)) return 'Digite um coeficiente maior que zero e até 1 (use vírgula para decimais).';
      return '';
    },
    // vazões digitadas em L/s: o projeto guarda em m³/h
    ajustar: function (caminho, v, E) {
      if (/^amb\.\d+\.(ins|exa|exaGeral)$/.test(caminho) && W.emLs(E)) return v * 3.6;
      return v;
    },
    aoAlterar: aoAlterar,

    acoes: {
      novo: novoProjeto,
      exportar: exportar,
      'incluir-amb': incluirAmb,
      'duplicar-amb': function (el) { duplicarAmb(+el.getAttribute('data-amb')); },
      'apagar-amb': function (el) { apagarAmb(+el.getAttribute('data-amb')); },
      'incluir-divisa': function (el) {
        var E = proj(), a = E.ambientes[+el.getAttribute('data-amb')];
        if (!a) return;
        a.divisas.push(M.divisaNova()); U.aberto.div = true; Kc.guardar();
      },
      'apagar-divisa': function (el) {
        var E = proj(), a = E.ambientes[+el.getAttribute('data-amb')], k = +el.getAttribute('data-k');
        if (!a || !a.divisas[k]) return;
        a.divisas.splice(k, 1); Kc.guardar();
      }
    },

    ajuda: [
      { titulo: 'O que o app faz', html: 'Calcula as vazões de ventilação e exaustão pela norma de cada ambiente e as pressões entre os ambientes pelas frestas das divisas: insuflamento, exaustão, vazão de diferença e pressão resultante.' },
      { titulo: 'Como usar', html: 'Preencha o projeto, inclua os ambientes com o uso e as divisas, confira o balanço e gere o memorial. Cada número calculado abre a conta com a fonte.' }
    ]
  };
})(window.HVAC);

</script>
<script>window.HVAC.ui.iniciar();</script>
